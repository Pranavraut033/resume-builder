# Curated model list for the managed (paid) provider.
# Pricing below is illustrative upstream list price x 1.3 markup — verify
# against each provider's current pricing page before going live, then keep
# this multiplier in sync with MARKUP_MULTIPLIER in webhook-handler's env
# (informational there; LiteLLM enforces spend using these per-token rates).
model_list:
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY
      input_cost_per_token: 0.00000325 # $2.50/1M x 1.3
      output_cost_per_token: 0.000013 # $10.00/1M x 1.3

  - model_name: claude-3-5-sonnet
    litellm_params:
      model: anthropic/claude-3-5-sonnet-latest
      api_key: os.environ/ANTHROPIC_API_KEY
      input_cost_per_token: 0.0000039 # $3.00/1M x 1.3
      output_cost_per_token: 0.0000195 # $15.00/1M x 1.3

  - model_name: gemini-2.0-flash
    litellm_params:
      model: gemini/gemini-2.0-flash
      api_key: os.environ/GEMINI_API_KEY
      input_cost_per_token: 0.00000013 # $0.10/1M x 1.3
      output_cost_per_token: 0.00000052 # $0.40/1M x 1.3

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
