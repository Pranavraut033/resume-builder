<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="0.55" stop-color="#2748c9"/>
      <stop offset="1" stop-color="#1d2a78"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.22" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plane" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Background squircle -->
  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#glow)"/>

  <!-- Document drop shadow -->
  <rect x="228" y="220" width="500" height="640" rx="44" fill="#0b173f" opacity="0.28"/>
  <!-- Document -->
  <rect x="228" y="206" width="500" height="640" rx="44" fill="#ffffff"/>

  <!-- Header bars -->
  <rect x="292" y="270" width="220" height="30" rx="15" fill="#1e293b"/>
  <rect x="292" y="316" width="140" height="20" rx="10" fill="#3b82f6"/>

  <!-- Divider -->
  <rect x="292" y="392" width="372" height="5" rx="2.5" fill="#e2e8f0"/>

  <!-- Body lines -->
  <rect x="292" y="436" width="372" height="16" rx="8" fill="#cbd5e1"/>
  <rect x="292" y="478" width="316" height="16" rx="8" fill="#cbd5e1"/>
  <rect x="292" y="520" width="210" height="16" rx="8" fill="#cbd5e1"/>
  <rect x="292" y="576" width="150" height="20" rx="10" fill="#3b82f6"/>
  <rect x="292" y="620" width="372" height="16" rx="8" fill="#cbd5e1"/>
  <rect x="292" y="662" width="332" height="16" rx="8" fill="#cbd5e1"/>
  <rect x="292" y="704" width="230" height="16" rx="8" fill="#cbd5e1"/>

  <!-- Ascending flight trail -->
  <path d="M330 792 C 470 792, 560 700, 700 470" fill="none" stroke="#93c5fd" stroke-width="10" stroke-linecap="round" stroke-dasharray="2 34"/>

  <!-- Paper plane taking off -->
  <g transform="translate(700 470) rotate(-52)">
    <path d="M0 -92 L64 46 L4 22 L-40 62 L-24 4 Z" fill="url(#plane)"/>
    <path d="M0 -92 L4 22 L-24 4 Z" fill="#fbbf24"/>
  </g>
</svg>
