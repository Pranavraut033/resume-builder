name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        type: string

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create_release.outputs.result }}
      tag: ${{ steps.resolve_tag.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve tag name
        id: resolve_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Extract release notes
        run: |
          TAG="${{ steps.resolve_tag.outputs.tag }}"
          awk -v tag="$TAG" '
            $0 ~ "^# " tag { found=1; print; next }
            found && /^# v[0-9]/ { found=0 }
            found { print }
          ' RELEASE_NOTES.md > release-notes-section.md
          if [ ! -s release-notes-section.md ]; then
            echo "::warning::No RELEASE_NOTES.md entry found for $TAG — falling back to generic release body"
          fi

      - name: Create GitHub release (draft)
        id: create_release
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const tag = '${{ steps.resolve_tag.outputs.tag }}';
            const notes = fs.readFileSync('release-notes-section.md', 'utf8').trim();
            const installSection = `### Installation\n\n**macOS**\n1. Download \`*_aarch64.dmg\` (Apple Silicon: M1/M2/M3/M4) or \`*_x64.dmg\` (Intel) below\n2. Open the downloaded file\n3. Drag **Resume Builder** into **Applications**\n4. On first launch: right-click → Open → Open (to bypass macOS Gatekeeper)\n\n**Windows**\n1. Run the \`*-setup.exe\` installer below\n2. When SmartScreen appears, click **More info** → **Run anyway**\n\n**Linux**\n1. Download the \`*.AppImage\` below, then \`chmod +x\` it and run it directly — no install needed`;
            const body = notes
              ? `${notes}\n\n${installSection}`
              : `## Resume Builder ${tag}\n\n${installSection}\n\n### Changelog\n\nSee [commits since last release](https://github.com/${{ github.repository }}/commits/${tag}) for full changes.`;

            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Resume Builder ${tag}`,
              body,
              draft: true,
              prerelease: false
            });
            return data.id;

  build:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            arch: aarch64
            args: "--target aarch64-apple-darwin"
            rust-targets: "aarch64-apple-darwin"
          - platform: macos-latest
            arch: x86_64
            args: "--target x86_64-apple-darwin"
            rust-targets: "x86_64-apple-darwin"
          # No explicit --target: builds for the runner's own native triple,
          # so cargo's output stays at target/release/bundle (no <triple>
          # subdir) — matches the Collect-updater-info paths below, which
          # aren't matrix.rust-targets-aware the way the macOS ones are.
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""
          - platform: windows-latest
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libfuse2

      - name: Build llm-core submodule
        working-directory: packages/llm-core
        run: |
          npm ci
          npm run build

      - name: Build ats-checker submodule
        working-directory: packages/ats-checker
        run: |
          npm ci
          npm run build

      - name: Install Node.js dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: "file:./dev.db"

      - name: Import self-signed certificate
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No APPLE_CERTIFICATE secret set, skipping certificate import (build will use ad-hoc signing)"
            exit 0
          fi

          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security import certificate.p12 \
            -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          rm -f certificate.p12

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Create self-signed certificate (Windows)
        if: matrix.platform == 'windows-latest'
        id: windows_cert
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject "CN=Resume Builder, O=Resume Builder" `
            -KeyUsage DigitalSignature `
            -FriendlyName "Resume Builder Self-Signed" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -NotAfter (Get-Date).AddYears(5) `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3","2.5.29.19={text}")

          $config = @{ bundle = @{ windows = @{ certificateThumbprint = $cert.Thumbprint; digestAlgorithm = "sha256" } } }
          $config | ConvertTo-Json -Depth 5 -Compress | Set-Content -Path windows-signing.conf.json -Encoding utf8

      - name: Build and publish Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
          # next build's TypeScript check step OOMs on the default ~2GB V8 heap
          # on GitHub-hosted runners; raise the ceiling well above what's needed.
          NODE_OPTIONS: --max-old-space-size=8192
          # linuxdeploy is itself an AppImage and can't mount via FUSE inside
          # the GH Actions VM; this makes it extract-and-run instead.
          APPIMAGE_EXTRACT_AND_RUN: "1"
          # linuxdeploy's bundled `strip` errors on the `.relr.dyn` section
          # modern glibc/ld produces on ubuntu-22.04+, killing the AppImage
          # step (tauri-apps/tauri#14796). Skip stripping instead of chasing it.
          NO_STRIP: "true"
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.platform == 'windows-latest' && '--config windows-signing.conf.json' || matrix.args }}
          includeUpdaterJson: false

      - name: Cleanup keychain
        if: always() && matrix.platform == 'macos-latest'
        run: security delete-keychain build.keychain || true

      - name: Collect updater info (macOS)
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          ARCHIVE=$(find "src-tauri/target/${{ matrix.rust-targets }}/release/bundle/macos" -name "*.app.tar.gz" | head -1)
          SIGNATURE=$(cat "${ARCHIVE}.sig")
          # tauri-action uploads macOS x86_64 assets suffixed "x64", not the
          # "x86_64" rust-target/matrix.arch name (aarch64 keeps its own name
          # as-is) — confirmed from an actual run's upload log, since this
          # bit us once already. Look up the real name on the draft release
          # rather than reconstructing it from the local build path.
          ASSET_ARCH="${{ matrix.arch == 'x86_64' && 'x64' || matrix.arch }}"
          FILENAME=$(gh api "repos/${{ github.repository }}/releases/${{ needs.create-release.outputs.release_id }}/assets" \
            --jq '.[].name' | grep -E '\.app\.tar\.gz$' | grep -F "$ASSET_ARCH")
          if [ -z "$FILENAME" ]; then
            echo "::error::No .app.tar.gz asset matching '$ASSET_ARCH' found on release ${{ needs.create-release.outputs.release_id }}"
            exit 1
          fi
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${FILENAME}"
          PLATFORM_KEY="darwin-${{ matrix.arch == 'x86_64' && 'x86_64' || 'aarch64' }}"
          jq -n --arg key "$PLATFORM_KEY" --arg url "$URL" --arg sig "$SIGNATURE" \
            '{($key): {"url": $url, "signature": $sig}}' \
            > update-info.json

      - name: Collect updater info (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        env:
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -name "*.AppImage" | head -1)
          SIGNATURE=$(cat "${APPIMAGE}.sig")
          FILENAME=$(basename "$APPIMAGE" | sed 's/ /./g')
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${FILENAME}"
          jq -n --arg url "$URL" --arg sig "$SIGNATURE" \
            '{"linux-x86_64": {"url": $url, "signature": $sig}}' \
            > update-info.json

      - name: Collect updater info (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          EXE=$(find src-tauri/target/release/bundle/nsis -name "*.exe" | head -1)
          SIGNATURE=$(cat "${EXE}.sig")
          FILENAME=$(basename "$EXE" | sed 's/ /./g')
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${FILENAME}"
          jq -n --arg url "$URL" --arg sig "$SIGNATURE" \
            '{"windows-x86_64": {"url": $url, "signature": $sig}}' \
            > update-info.json

      - name: Upload updater info
        uses: actions/upload-artifact@v4
        with:
          name: update-info-${{ matrix.platform }}${{ matrix.arch && format('-{0}', matrix.arch) || '' }}
          path: update-info.json
          retention-days: 1

  cleanup-failed-release:
    needs: [create-release, build]
    if: always() && needs.create-release.result == 'success' && needs.build.result != 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete orphaned draft release
        uses: actions/github-script@v8
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.deleteRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.RELEASE_ID
            });

  publish-release:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Download updater info
        uses: actions/download-artifact@v4
        with:
          pattern: update-info-*
          path: update-info
          merge-multiple: false

      - name: Generate update manifest
        env:
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          jq -s 'add' update-info/*/update-info.json > platforms.json
          jq -n \
            --arg version "$VERSION" \
            --arg notes "See https://github.com/${{ github.repository }}/releases/tag/${TAG} for details." \
            --arg pub_date "$DATE" \
            --slurpfile platforms platforms.json \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: $platforms[0]}' \
            > update.json

      - name: Upload update manifest to release
        uses: actions/github-script@v8
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            const fs = require('fs');
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.RELEASE_ID,
              name: 'update.json',
              data: fs.readFileSync('update.json')
            });

      - name: Publish release
        uses: actions/github-script@v8
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.RELEASE_ID,
              draft: false
            });

      - name: Trigger landing page rebuild
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # A release published via the GITHUB_TOKEN (as above) doesn't fire
        # the `release` event for other workflows — GitHub suppresses event
        # chaining from the default token to prevent infinite loops. So
        # deploy-landing.yml's own `release: types: [published]` trigger
        # (which still correctly fires for a human manually publishing a
        # release from the UI) never sees this one. Dispatch it explicitly
        # instead — workflow_dispatch via the API isn't subject to that
        # restriction.
        run: gh workflow run deploy-landing.yml --repo ${{ github.repository }}
