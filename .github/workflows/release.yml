name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        type: string

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create_release.outputs.result }}
      tag: ${{ steps.resolve_tag.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve tag name
        id: resolve_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub release (draft)
        id: create_release
        uses: actions/github-script@v8
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: '${{ steps.resolve_tag.outputs.tag }}',
              name: 'Resume Builder ${{ steps.resolve_tag.outputs.tag }}',
              body: `## Resume Builder ${{ steps.resolve_tag.outputs.tag }}\n\nInitial release. Resume Builder is a local-first desktop app for tailoring resumes and cover letters to a specific job with AI — all data and API keys stay on your machine.\n\n### Features\n\n- **Base profile** — one reusable profile (skills, experience, projects, education) that every resume is tailored from\n- **AI tailoring** — paste a job description and generate a matched resume and cover letter\n- **Inline WYSIWYG editor** — edit the rendered document directly, no separate form view\n- **Chat-based editing assistant** — refine sections by describing the change instead of hand-editing\n- **AI humanizer** — rewrite AI-flavored text to read more naturally\n- **Multiple templates** — several resume layouts with per-job color/font/layout customization\n- **Version history** — every generated resume/cover letter is versioned per job\n- **PDF and TXT export**\n- **Bring your own API key** (OpenAI-compatible providers) or use the built-in managed LLM gateway — no server ever sees your key\n- **Local SQLite storage** — no account, no cloud sync, your data never leaves the device\n\n### Installation\n\n**macOS**\n1. Download \`Resume.Builder_*_universal.dmg\` below\n2. Open the downloaded file\n3. Drag **Resume Builder** into **Applications**\n4. On first launch: right-click → Open → Open (to bypass macOS Gatekeeper)\n\n**Windows**\n1. Download the \`*-setup.exe\` installer below\n2. Run it and follow the prompts (Windows SmartScreen may warn about an unsigned app — click **More info → Run anyway**)\n\n**Linux**\n1. Download the \`.AppImage\` (portable) or \`.deb\` (Debian/Ubuntu) below\n2. For AppImage: \`chmod +x *.AppImage && ./*.AppImage\`\n3. For deb: \`sudo dpkg -i *.deb\`\n\n### Changelog\n\nSee [commits since last release](https://github.com/${{ github.repository }}/commits/${{ steps.resolve_tag.outputs.tag }}) for full changes.`,
              draft: true,
              prerelease: false
            });
            return data.id;

  build:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - platform: ubuntu-22.04
            # linuxdeploy's real failure reason gets swallowed into a generic
            # "failed to run linuxdeploy" otherwise (tauri-apps/tauri#14796)
            args: "--verbose"
            rust-targets: ""
          - platform: windows-latest
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.platform }}
    # Linux AppImage bundling is unreliable in GH Actions (linuxdeploy on
    # ubuntu-22.04, tauri-apps/tauri#14796) and shouldn't hold up shipping
    # macOS/Windows. Remove once that's root-caused and fixed for real.
    continue-on-error: ${{ matrix.platform == 'ubuntu-22.04' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libfuse2

      - name: Build llm-core submodule
        working-directory: packages/llm-core
        run: |
          npm ci
          npm run build

      - name: Build ats-checker submodule
        working-directory: packages/ats-checker
        run: |
          npm ci
          npm run build

      - name: Install Node.js dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: "file:./dev.db"

      - name: Import self-signed certificate
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No APPLE_CERTIFICATE secret set, skipping certificate import (build will use ad-hoc signing)"
            exit 0
          fi

          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security import certificate.p12 \
            -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          rm -f certificate.p12

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Create self-signed certificate (Windows)
        if: matrix.platform == 'windows-latest'
        id: windows_cert
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject "CN=Resume Builder, O=Resume Builder" `
            -KeyUsage DigitalSignature `
            -FriendlyName "Resume Builder Self-Signed" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -NotAfter (Get-Date).AddYears(5) `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3","2.5.29.19={text}")

          $config = @{ bundle = @{ windows = @{ certificateThumbprint = $cert.Thumbprint; digestAlgorithm = "sha256" } } }
          $config | ConvertTo-Json -Depth 5 -Compress | Set-Content -Path windows-signing.conf.json -Encoding utf8

      - name: Build and publish Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
          # next build's TypeScript check step OOMs on the default ~2GB V8 heap
          # on GitHub-hosted runners; raise the ceiling well above what's needed.
          NODE_OPTIONS: --max-old-space-size=8192
          # linuxdeploy is itself an AppImage and can't mount via FUSE inside
          # the GH Actions VM; this makes it extract-and-run instead.
          APPIMAGE_EXTRACT_AND_RUN: "1"
          # linuxdeploy's bundled `strip` errors on the `.relr.dyn` section
          # modern glibc/ld produces on ubuntu-22.04+, killing the AppImage
          # step (tauri-apps/tauri#14796). Skip stripping instead of chasing it.
          NO_STRIP: "true"
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.platform == 'windows-latest' && '--config windows-signing.conf.json' || matrix.args }}
          includeUpdaterJson: false

      - name: Cleanup keychain
        if: always() && matrix.platform == 'macos-latest'
        run: security delete-keychain build.keychain || true

      - name: Collect updater info (macOS)
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          ARCHIVE=$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -name "*.app.tar.gz" | head -1)
          SIGNATURE=$(cat "${ARCHIVE}.sig")
          FILENAME=$(basename "$ARCHIVE" | sed 's/ /./g')
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${FILENAME}"
          jq -n --arg url "$URL" --arg sig "$SIGNATURE" \
            '{"darwin-x86_64": {"url": $url, "signature": $sig}, "darwin-aarch64": {"url": $url, "signature": $sig}}' \
            > update-info.json

      - name: Collect updater info (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        env:
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -name "*.AppImage" | head -1)
          SIGNATURE=$(cat "${APPIMAGE}.sig")
          FILENAME=$(basename "$APPIMAGE" | sed 's/ /./g')
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${FILENAME}"
          jq -n --arg url "$URL" --arg sig "$SIGNATURE" \
            '{"linux-x86_64": {"url": $url, "signature": $sig}}' \
            > update-info.json

      - name: Collect updater info (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          EXE=$(find src-tauri/target/release/bundle/nsis -name "*.exe" | head -1)
          SIGNATURE=$(cat "${EXE}.sig")
          FILENAME=$(basename "$EXE" | sed 's/ /./g')
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${FILENAME}"
          jq -n --arg url "$URL" --arg sig "$SIGNATURE" \
            '{"windows-x86_64": {"url": $url, "signature": $sig}}' \
            > update-info.json

      - name: Upload updater info
        uses: actions/upload-artifact@v4
        with:
          name: update-info-${{ matrix.platform }}
          path: update-info.json
          retention-days: 1

  cleanup-failed-release:
    needs: [create-release, build]
    if: always() && needs.create-release.result == 'success' && needs.build.result != 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete orphaned draft release
        uses: actions/github-script@v8
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.deleteRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.RELEASE_ID
            });

  publish-release:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download updater info
        uses: actions/download-artifact@v4
        with:
          pattern: update-info-*
          path: update-info
          merge-multiple: false

      - name: Generate update manifest
        env:
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          jq -s 'add' update-info/*/update-info.json > platforms.json
          jq -n \
            --arg version "$VERSION" \
            --arg notes "See https://github.com/${{ github.repository }}/releases/tag/${TAG} for details." \
            --arg pub_date "$DATE" \
            --slurpfile platforms platforms.json \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: $platforms[0]}' \
            > update.json

      - name: Upload update manifest to release
        uses: actions/github-script@v8
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            const fs = require('fs');
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.RELEASE_ID,
              name: 'update.json',
              data: fs.readFileSync('update.json')
            });

      - name: Publish release
        uses: actions/github-script@v8
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.RELEASE_ID,
              draft: false
            });
