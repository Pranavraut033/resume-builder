name: Build

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            artifact-name: Resume-Builder-macOS
            artifact-glob: src-tauri/target/release/bundle/dmg/*.dmg
          - platform: ubuntu-22.04
            artifact-name: Resume-Builder-Linux
            artifact-glob: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
          - platform: windows-latest
            artifact-name: Resume-Builder-Windows
            artifact-glob: src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libfuse2

      - name: Build llm-core submodule
        working-directory: packages/llm-core
        run: |
          npm ci
          npm run build

      - name: Install Node.js dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: "file:./dev.db"

      - name: Import self-signed certificate
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No APPLE_CERTIFICATE secret set, skipping certificate import"
            exit 0
          fi

          # Create a temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          # Import the certificate
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security import certificate.p12 \
            -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          rm -f certificate.p12

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Create self-signed certificate (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject "CN=Resume Builder, O=Resume Builder" `
            -KeyUsage DigitalSignature `
            -FriendlyName "Resume Builder Self-Signed" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -NotAfter (Get-Date).AddYears(5) `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3","2.5.29.19={text}")

          $config = @{ bundle = @{ windows = @{ certificateThumbprint = $cert.Thumbprint; digestAlgorithm = "sha256" } } }
          $config | ConvertTo-Json -Depth 5 -Compress | Set-Content -Path windows-signing.conf.json -Encoding utf8

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # tauri.conf.json sets plugins.updater.pubkey, so every build (not
          # just Release) now needs the matching private key or tauri-cli
          # refuses to build at all.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Code signing identity — empty string disables code signing in CI for PR builds
          # Set APPLE_SIGNING_IDENTITY secret to enable (e.g. "Developer ID Application: ...")
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
          # next build's TypeScript check step OOMs on the default ~2GB V8 heap
          # on GitHub-hosted runners; raise the ceiling well above what's needed.
          NODE_OPTIONS: --max-old-space-size=8192
          # linuxdeploy is itself an AppImage and can't mount via FUSE inside
          # the GH Actions VM; this makes it extract-and-run instead.
          APPIMAGE_EXTRACT_AND_RUN: "1"
          # linuxdeploy's bundled `strip` errors on the `.relr.dyn` section
          # modern glibc/ld produces on ubuntu-22.04+, killing the AppImage
          # step (tauri-apps/tauri#14796). Skip stripping instead of chasing it.
          NO_STRIP: "true"
        with:
          args: ${{ matrix.platform == 'windows-latest' && '--config windows-signing.conf.json' || matrix.platform == 'ubuntu-22.04' && '--verbose' || '' }}

      - name: Cleanup keychain
        if: always() && matrix.platform == 'macos-latest'
        run: security delete-keychain build.keychain || true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-glob }}
          retention-days: 7
