name: CI

on:
  push:
  pull_request:

jobs:
  type-check:
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Build llm-core submodule
        working-directory: packages/llm-core
        run: |
          npm ci
          npm run build

      - name: Install Node.js dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate
        env:
          DATABASE_URL: "file:./dev.db"

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint
